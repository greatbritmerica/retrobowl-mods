<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retro Bowl Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a stadium scoreboard on top (the one loud thing), then quiet playbook pages below it. */
:root {
  --field: #edf1e6; --panel: #ffffff; --ink: #17211b; --muted: #5a685e; --line: #cdd6c6;
  --turf: #1d6b3a; --turf-ink: #ffffff; --lamp: #a9670a; --flag: #b53722; --wash: #e3ead9;
  --board: #101613; --board-ink: #f4f1e4; --board-lamp: #f5b63c; --board-dim: #7d8b80;
  --display: "Silkscreen", "Courier New", monospace;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --field: #0c1310; --panel: #141d18; --ink: #e3eade; --muted: #92a196; --line: #26342b;
    --turf: #58c47c; --turf-ink: #07130c; --lamp: #f2b441; --flag: #ef6c54; --wash: #1a2620;
    --board: #060a08; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --field: #0c1310; --panel: #141d18; --ink: #e3eade; --muted: #92a196; --line: #26342b;
  --turf: #58c47c; --turf-ink: #07130c; --lamp: #f2b441; --flag: #ef6c54; --wash: #1a2620;
  --board: #060a08; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--field); color: var(--ink); font: 400 16px/1.45 var(--body); -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 64px; }

/* scoreboard */
.board { background: var(--board); color: var(--board-ink); padding: 18px 16px 0; }
.board-in { max-width: 760px; margin: 0 auto; }
.board h1 { font: 700 22px/1.1 var(--display); letter-spacing: .02em; }
.board p { margin: 6px 0 14px; color: var(--board-dim); font-size: 14px; max-width: 52ch; }
.tally { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: #26302a; border: 1px solid #26302a; }
.tally div { background: var(--board); padding: 10px 8px 9px; text-align: center; }
.tally b { display: block; font: 700 26px/1 var(--display); color: var(--board-lamp); font-variant-numeric: tabular-nums; }
.tally b.bad { color: #ff7a5c; }
.tally span { display: block; margin-top: 5px; font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--board-dim); }
/* yard-line ticks: one long mark every fifth */
.hash { height: 14px; margin-top: 14px; background:
  repeating-linear-gradient(90deg, #f4f1e4 0 2px, transparent 2px 60px) 0 0 / 100% 14px no-repeat,
  repeating-linear-gradient(90deg, #5d6a60 0 1px, transparent 1px 12px) 0 6px / 100% 8px no-repeat; }

/* tabs */
.tabs { position: sticky; top: 0; z-index: 5; background: var(--field); border-bottom: 1px solid var(--line); }
.tabs-in { max-width: 760px; margin: 0 auto; padding: 0 8px; display: flex; gap: 2px; overflow-x: auto; }
.tabs a { flex: 1 0 auto; text-align: center; padding: 13px 12px 11px; text-decoration: none; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--turf); }
.tabs a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, textarea:focus-visible { outline: 2px solid var(--turf); outline-offset: 2px; }

section.view { display: none; padding-top: 20px; }
section.view.on { display: block; }
.lede { color: var(--muted); max-width: 62ch; margin: 0 0 16px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 16px; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 10px 14px; min-height: 44px; font-weight: 600; cursor: pointer; }
.btn.go { background: var(--turf); border-color: var(--turf); color: var(--turf-ink); }
.btn.quiet { background: transparent; }
.btn.small { min-height: 36px; padding: 6px 10px; font-size: 14px; }
.btn.danger { color: var(--flag); }
.btn[disabled] { opacity: .5; cursor: default; }
.note { font-size: 14px; color: var(--muted); }
.toast { position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 520px; margin: 0 auto; background: var(--board); color: var(--board-ink); padding: 12px 14px; border-radius: 10px; z-index: 20; font-weight: 500; }
.toast[hidden] { display: none; }

/* tuning */
details.group { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; }
details.group > summary { list-style: none; cursor: pointer; padding: 13px 14px; display: flex; align-items: baseline; gap: 10px; font-weight: 700; }
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary::after { content: "+"; margin-left: auto; color: var(--muted); font-weight: 500; }
details.group[open] > summary::after { content: "\2212"; }
details.group > summary i { font-style: normal; font-weight: 600; font-size: 13px; color: var(--lamp); }
.rows { border-top: 1px solid var(--line); }
.row { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.row:last-child { border-bottom: 0; }
.row label { font-weight: 600; }
.row .help { font-size: 14px; color: var(--muted); max-width: 60ch; }
.ctl { display: flex; align-items: center; gap: 10px; }
.ctl input[type=range] { flex: 1; min-width: 0; height: 32px; accent-color: var(--turf); }
.numbox { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; background: var(--field); }
.numbox input { width: 62px; border: 0; background: transparent; padding: 8px 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.numbox span { color: var(--muted); font-size: 14px; min-width: 10px; }
.row.changed label::after { content: "changed"; margin-left: 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--lamp); }
.was { font-size: 13px; }
.was button { appearance: none; border: 0; background: none; padding: 4px 0; color: var(--turf); font-weight: 600; cursor: pointer; text-decoration: underline; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.presets input { flex: 1 1 150px; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; background: var(--panel); min-height: 40px; }
.chip { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); overflow: hidden; }
.chip button { appearance: none; border: 0; background: none; padding: 7px 10px; cursor: pointer; font-weight: 600; }
.chip button + button { border-left: 1px solid var(--line); color: var(--muted); }

/* rules */
.rule { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--turf); border-radius: 10px; margin-bottom: 12px; }
.rule.bad { border-left-color: var(--flag); }
.rule.off { border-left-color: var(--line); opacity: .7; }
.rule header { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.rule header input { flex: 1; min-width: 0; border: 0; background: transparent; font-weight: 700; font-size: 17px; padding: 6px 2px; }
.part { padding: 10px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.part:last-child { border-bottom: 0; }
.part > b { font: 700 12px/1 var(--display); letter-spacing: .06em; color: var(--muted); }
.line { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.line select, .line input[type=text], .line input[type=number] { border: 1px solid var(--line); border-radius: 8px; background: var(--field); padding: 8px 8px; min-height: 40px; min-width: 0; }
.line select { flex: 1 1 150px; max-width: 100%; }
.line input[type=text] { flex: 1 1 130px; }
.line input[type=number] { width: 84px; text-align: right; font-variant-numeric: tabular-nums; }
.line .unit { color: var(--muted); font-size: 14px; }
.line .x { appearance: none; border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; padding: 8px; cursor: pointer; margin-left: auto; }
.hint { font-size: 13px; color: var(--muted); }
.probs { margin: 0; padding: 10px 12px 10px 30px; color: var(--flag); font-size: 14px; font-weight: 500; }
.examples { display: grid; gap: 8px; margin-bottom: 18px; }
.ex { display: flex; gap: 10px; align-items: flex-start; background: var(--wash); border-radius: 10px; padding: 10px 12px; }
.ex div { flex: 1; min-width: 0; }
.ex b { display: block; }
.ex span { font-size: 14px; color: var(--muted); }
pre.file { background: var(--board); color: var(--board-ink); padding: 12px; border-radius: 10px; overflow-x: auto; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; margin: 8px 0 0; white-space: pre; }
details.raw { margin-top: 6px; }
details.raw summary { cursor: pointer; color: var(--turf); font-weight: 600; padding: 8px 0; }

/* report */
.pick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.pick select, .pick input[type=file] { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 9px 10px; min-height: 44px; max-width: 100%; }
.sample { display: inline-block; background: var(--wash); color: var(--lamp); border-radius: 6px; padding: 3px 8px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.final { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 4px 0 16px; }
.final strong { font: 700 34px/1 var(--display); font-variant-numeric: tabular-nums; }
.final em { font-style: normal; font-weight: 700; padding: 3px 9px; border-radius: 6px; background: var(--wash); }
.final em.w { color: var(--turf); } .final em.l { color: var(--flag); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 18px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.tile span { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tile b { display: block; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
.tile small { color: var(--muted); font-size: 13px; }
.meter { height: 6px; border-radius: 3px; background: var(--wash); margin-top: 8px; position: relative; overflow: hidden; }
.meter i { position: absolute; inset: 0 auto 0 0; background: var(--turf); }
.meter::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: .45; }
.tbl { overflow-x: auto; margin-bottom: 18px; }
h3.sub { font-size: 15px; margin: 0 0 6px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
th { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* files */
ol.steps { margin: 0 0 18px; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 10px; }
ol.steps li { counter-increment: s; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px 12px 52px; position: relative; }
ol.steps li::before { content: counter(s); position: absolute; left: 14px; top: 11px; font: 700 22px/1 var(--display); color: var(--turf); }
ol.steps b { display: block; }
code { font: 14px ui-monospace, Menlo, Consolas, monospace; background: var(--wash); padding: 1px 5px; border-radius: 4px; }
@media (prefers-reduced-motion: no-preference) { .tile b, .tally b { transition: color .2s; } }
</style>
</head>
<body>
<div class="board"><div class="board-in">
  <h1>RETRO BOWL WORKSHOP</h1>
  <p>Tune the mod and build your own rules. Save the files into the game's folder and they apply on your next snap.</p>
  <div class="tally" aria-live="polite">
    <div><b id="t-set">00</b><span>Settings changed</span></div>
    <div><b id="t-rules">00</b><span>Rules</span></div>
    <div><b id="t-bad">00</b><span>Need fixing</span></div>
  </div>
  <div class="hash" aria-hidden="true"></div>
</div></div>
<nav class="tabs" aria-label="Sections"><div class="tabs-in">
  <a href="#tune" data-tab="tune">Tune</a>
  <a href="#rules" data-tab="rules">Rules</a>
  <a href="#report" data-tab="report">Report</a>
  <a href="#files" data-tab="files">Files</a>
</div></nav>
<div class="wrap">
  <section class="view" id="v-tune"></section>
  <section class="view" id="v-rules"></section>
  <section class="view" id="v-report"></section>
  <section class="view" id="v-files"></section>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script>// core.js - the workshop's logic with no page in it, so the same code runs in the page and in tests.
// Everything here must agree with src/rules.c (the mod's parser) and tools/tunables.json.
(function (root) {
  'use strict';

  // ---- the blocks a rule is built from (mirrors src/rules.c) ----
  var EVENTS = [
    { id: 'presnap', label: 'Before the snap', hint: 'Once each play, when your pre-snap panel appears. The place to add a button or a message.' },
    { id: 'snap', label: 'At the snap', hint: 'The moment the play starts. Speed changes belong here.' },
    { id: 'throw', label: 'A pass is thrown', hint: 'Just after release, before the defender\'s play is decided, so a rule can still change this throw\'s chances.' },
    { id: 'catch', label: 'A pass is caught', hint: '' },
    { id: 'incomplete', label: 'A pass falls incomplete', hint: '' },
    { id: 'intercepted', label: 'A pass is intercepted', hint: '' },
    { id: 'sack', label: 'You are sacked', hint: '' },
    { id: 'touchdown', label: 'You score a touchdown', hint: '' },
    { id: 'play_end', label: 'The play ends', hint: 'After every one of your run or pass plays. The place to count things.' },
    { id: 'button', label: 'A button is pressed', hint: 'A button one of your "Before the snap" rules added.', arg: true }
  ];
  // kind: num (compare to a number), yesno (is / is not), choice (pick one), counter (named), pressed (button name)
  var VARS = [
    { id: 'down', label: 'Down', kind: 'num', unit: '', hint: '1 to 4' },
    { id: 'togo', label: 'Yards to go', kind: 'num', unit: 'yds' },
    { id: 'legs', label: "Back's legs", kind: 'num', unit: '%', hint: '0 to 100' },
    { id: 'run_share', label: 'How often you run lately', kind: 'num', unit: '%' },
    { id: 'pass_dial', label: 'Pass coverage tightness', kind: 'num', unit: '%' },
    { id: 'run_dial', label: 'Run defense tightness', kind: 'num', unit: '%' },
    { id: 'held', label: 'Seconds from snap to throw', kind: 'num', unit: 's', from: 'throw' },
    { id: 'depth', label: 'Throw depth', kind: 'num', unit: 'yds', from: 'throw' },
    { id: 'yards', label: 'Yards the play gained', kind: 'num', unit: 'yds', from: 'end' },
    { id: 'is_run', label: 'It is a run', kind: 'yesno', from: 'snap' },
    { id: 'worked', label: 'The play worked', kind: 'yesno', from: 'end' },
    { id: 'play_action', label: 'Play action is on', kind: 'yesno' },
    { id: 'scrambled', label: 'You scrambled', kind: 'yesno', from: 'snap' },
    { id: 'protection', label: 'Protection call', kind: 'choice', choices: [[0, 'Normal'], [1, 'Max protect'], [2, 'Slide up'], [3, 'Slide down']] },
    { id: 'chance', label: 'Random chance', kind: 'num', unit: '%', hint: '"less than 30" is true 30% of the time' },
    { id: 'var', label: 'A counter', kind: 'counter' },
    { id: 'pressed', label: 'A button is on', kind: 'pressed' }
  ];
  var OPS = [['=', 'is'], ['!=', 'is not'], ['<', 'less than'], ['<=', 'at most'], ['>', 'more than'], ['>=', 'at least']];
  var GROUPS = [['qb', 'Your quarterback'], ['back', 'Your back'], ['receivers', 'Your receivers'], ['line', 'Your line'],
                ['rushers', 'Their pass rushers'], ['coverage', 'Their coverage'], ['defense', 'Their whole defense']];
  var ACTIONS = [
    { id: 'tune', label: 'Change a setting' },
    { id: 'speed', label: 'Speed a group up or down' },
    { id: 'legs', label: "Change the back's legs" },
    { id: 'button', label: 'Add a pre-snap button' },
    { id: 'msg', label: 'Show a message before the snap' },
    { id: 'var', label: 'Change a counter' }
  ];
  var LIMITS = { rules: 64, conds: 6, acts: 8, buttons: 3, name: 39, label: 31, msg: 71, counter: 24 };

  function ident(s) { return String(s || '').replace(/[^A-Za-z0-9_]/g, '_').slice(0, LIMITS.counter); }
  function oneLine(s, max) { return String(s || '').replace(/[\r\n\t]+/g, ' ').replace(/ +/g, ' ').trim().slice(0, max); }
  function num(v) { var n = Number(v); if (!isFinite(n)) n = 0; return String(Math.round(n * 1e6) / 1e6); }
  function byKey(T) { var m = {}; T.forEach(function (t) { m[t.key] = t; }); return m; }

  // ---- settings file ----
  function settingsText(T, values) {
    var out = ['# Retro Bowl mod settings - made with the Workshop', '# Save as rbmod_settings.txt in the game\'s folder. Lines starting with # are ignored.'];
    var group = null;
    T.forEach(function (t) {
      if (t.group !== group) { group = t.group; out.push('', '# ' + group); }
      var v = values[t.key] === undefined ? t.def : values[t.key];
      out.push(t.key + ' = ' + num(v));
    });
    return out.join('\n') + '\n';
  }
  function parseSettings(T, text) {
    var keys = byKey(T), values = {}, unknown = [];
    String(text).split(/\r?\n/).forEach(function (line) {
      line = line.trim();
      if (!line || line[0] === '#') return;
      var m = /^([A-Za-z0-9_]+)\s*=?\s*(-?[0-9.]+(?:e-?[0-9]+)?)$/.exec(line);
      if (!m) return;
      if (!keys[m[1]]) { unknown.push(m[1]); return; }
      values[m[1]] = Number(m[2]);
    });
    return { values: values, unknown: unknown };
  }
  function changed(T, values) {
    return T.filter(function (t) { return values[t.key] !== undefined && Math.abs(values[t.key] - t.def) > 1e-9; });
  }

  // ---- rules file ----
  // rule: { name, ev, arg, conds:[{v, name, op, val}], acts:[{t, ...}] }
  function condLine(c) {
    var v = c.v === 'var' ? 'var.' + ident(c.name) : c.v === 'pressed' ? 'pressed.' + oneLine(c.name, LIMITS.label).replace(/ /g, '_') : c.v;
    return 'if ' + v + ' ' + c.op + ' ' + num(c.val);
  }
  function actLine(a, T) {
    if (a.t === 'tune') {
      var t = byKey(T)[a.key], v = Number(a.val);
      if (t && t.pct && a.op !== '*') v = v / 100;          // percent settings are typed as percents, stored as fractions
      return 'then tune ' + a.key + ' ' + a.op + ' ' + num(v) + ' ' + (a.keep ? 'keep' : 'play');
    }
    if (a.t === 'speed') return 'then speed ' + a.group + ' ' + num(a.val);
    if (a.t === 'legs') return 'then legs ' + a.op + ' ' + num(a.val);
    if (a.t === 'button') return 'then button ' + oneLine(a.text, LIMITS.label);
    if (a.t === 'msg') return 'then msg ' + oneLine(a.text, LIMITS.msg);
    if (a.t === 'var') return 'then var ' + ident(a.name) + ' ' + a.op + ' ' + num(a.val);
    return '';
  }
  function rulesText(rules, T) {
    var out = ['# Retro Bowl mod rules - made with the Workshop', '# Save as rbmod_rules.txt in the game\'s folder.'];
    rules.forEach(function (r) {
      if (r.off) return;
      out.push('', 'rule ' + (oneLine(r.name, LIMITS.name) || 'Unnamed rule'));
      out.push('when ' + r.ev + (r.ev === 'button' ? ' ' + oneLine(r.arg, LIMITS.label) : ''));
      (r.conds || []).slice(0, LIMITS.conds).forEach(function (c) { out.push(condLine(c)); });
      (r.acts || []).slice(0, LIMITS.acts).forEach(function (a) { var l = actLine(a, T); if (l) out.push(l); });
      out.push('end');
    });
    return out.join('\n') + '\n';
  }
  // what is wrong with a rule, in words (empty list = fine)
  function problems(r, rules, T) {
    var p = [], keys = byKey(T);
    if (!oneLine(r.name, LIMITS.name)) p.push('Give the rule a name.');
    if (r.ev === 'button' && !oneLine(r.arg, LIMITS.label)) p.push('Say which button this rule answers to.');
    if (r.ev === 'button') {
      var label = oneLine(r.arg, LIMITS.label), made = rules.some(function (o) {
        return !o.off && o.ev === 'presnap' && (o.acts || []).some(function (a) { return a.t === 'button' && oneLine(a.text, LIMITS.label) === label; });
      });
      if (label && !made) p.push('No "Before the snap" rule adds a button called "' + label + '", so this can never fire.');
    }
    if (!(r.acts || []).length) p.push('Add at least one thing for the rule to do.');
    (r.conds || []).forEach(function (c) {
      if ((c.v === 'var' || c.v === 'pressed') && !oneLine(c.name, LIMITS.label)) p.push('A condition is missing its ' + (c.v === 'var' ? 'counter' : 'button') + ' name.');
    });
    (r.acts || []).forEach(function (a) {
      if (a.t === 'tune' && !keys[a.key]) p.push('Pick which setting to change.');
      if ((a.t === 'button' || a.t === 'msg') && !oneLine(a.text, 80)) p.push(a.t === 'button' ? 'A button needs a label.' : 'A message needs some text.');
      if (a.t === 'button' && r.ev !== 'presnap') p.push('Buttons can only be added by a "Before the snap" rule.');
      if (a.t === 'var' && !ident(a.name)) p.push('A counter needs a name.');
      if (a.t === 'speed' && !(Number(a.val) > 0)) p.push('Speed must be above 0%.');
    });
    return p;
  }

  // ---- report: rbmod_plays.txt ----

  function sampleGame() {     // a made-up game, clearly marked as an example until a real file is loaded

    function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
    for (var i = 0; i < 58; i++) {

        var u = rnd(); play = u < 0.22 ? 'pick' : u < 0.62 ? 'whiff' : u < 0.74 ? 'breakup' : 'hit';
        held = Math.round((0.8 + rnd() * 2.2) * 100) / 100; quick = held <= 1.2 ? 1 : held >= 2 ? 0 : Math.round((2 - held) / 0.8 * 100) / 100;
        legs = Math.min(100, legs + 6);

        else if (play === 'pick' && rnd() < 0.2) { yds = 0; end = 'int'; }
        else { caught = 1; yds = Math.round((play === 'whiff' ? 4 + rnd() * 12 : 1 + rnd() * 7) * 10) / 10; }
