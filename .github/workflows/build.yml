name: build

on:
  push:
  workflow_dispatch:

jobs:
  dylib:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the super throw flight math
        run: mkdir -p build && cc -o build/bullet_test tests/bullet_test.c src/bullet.c -lm && build/bullet_test
      - name: Build libRBMod.dylib
        run: make
      - name: Inspect
        run: |
          file build/libRBMod.dylib
          otool -L build/libRBMod.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: libRBMod
          path: build/libRBMod.dylib
